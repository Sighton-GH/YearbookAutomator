<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Portrait autoflow animation</title>
  <desc id="desc">Portraits move from a source panel into a realistic yearbook template with aligned arrows.</desc>
  <style>
    :root {
      --bg: #f6f9ff;
      --panel: #ffffff;
      --accent: #16a34a;
      --accent-2: #0ea5e9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe4f3;
      --slot: #eef2ff;
      --slot-stroke: #c7d2fe;
    }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 2; }
    .slot { fill: var(--slot); stroke: var(--slot-stroke); stroke-width: 2; }
    .name-line { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
    .quote-line { stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; }
    .portrait { fill: #ffe5b4; stroke: #f59e0b; stroke-width: 2; }
    .hair { fill: #1f2937; }
    .shirt-a { fill: #0ea5e9; }
    .shirt-b { fill: #22c55e; }
    .shirt-c { fill: #a78bfa; }
    .arrow { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 8; }
    .arrow-head { fill: var(--accent); }
    .note { font-family: "Inter", "Segoe UI", sans-serif; fill: var(--muted); font-size: 14px; }
    .label { font-family: "Inter", "Segoe UI", sans-serif; fill: var(--text); font-weight: 700; font-size: 17px; }
    .small { font-size: 13px; fill: var(--muted); }
    .pill { fill: #ecfdf3; stroke: #bbf7d0; stroke-width: 1.5; }
    .pill-text { font-family: "Inter", "Segoe UI", sans-serif; fill: #15803d; font-size: 12px; font-weight: 700; }
    @keyframes dash { to { stroke-dashoffset: -220; } }
    .arrow-anim { animation: dash 2.6s linear infinite; }
  </style>

  <rect width="1080" height="620" fill="var(--bg)"/>

  <!-- Left card: source portraits -->
  <g transform="translate(70 90)">
    <rect class="card" rx="16" ry="16" width="320" height="460"/>
    <text x="26" y="40" class="label">Source portraits</text>
    <text x="26" y="66" class="small">Drag-and-drop folders</text>

    <!-- Portrait A -->
    <g transform="translate(40 110)">
      <rect x="-10" y="-10" width="120" height="140" rx="18" ry="18" fill="#eef7ff" stroke="var(--border)"/>
      <circle class="portrait" cx="50" cy="48" r="38"/>
      <path class="hair" d="M12 44 q38-26 76 0 v10 q-12 18-38 18t-38-18z"/>
      <rect class="shirt-a" x="14" y="70" width="72" height="48" rx="12" ry="12"/>
      <text x="50" y="132" text-anchor="middle" class="small">Alex</text>
    </g>

    <!-- Portrait B -->
    <g transform="translate(180 190)">
      <rect x="-10" y="-10" width="120" height="140" rx="18" ry="18" fill="#eef7ff" stroke="var(--border)"/>
      <circle class="portrait" cx="50" cy="48" r="38" fill="#ffd7d7" stroke="#f97316"/>
      <path class="hair" d="M12 42 q38-22 76 0 v14 q-14 16-38 16t-38-16z" fill="#0f172a"/>
      <rect class="shirt-b" x="14" y="70" width="72" height="48" rx="12" ry="12"/>
      <text x="50" y="132" text-anchor="middle" class="small">Blake</text>
    </g>

    <!-- Portrait C -->
    <g transform="translate(40 280)">
      <rect x="-10" y="-10" width="120" height="140" rx="18" ry="18" fill="#eef7ff" stroke="var(--border)"/>
      <circle class="portrait" cx="50" cy="48" r="38" fill="#e5e7eb" stroke="#6b7280"/>
      <path class="hair" d="M12 44 q38-26 76 0 v10 q-14 18-38 18t-38-18z" fill="#374151"/>
      <rect class="shirt-c" x="14" y="70" width="72" height="48" rx="12" ry="12"/>
      <text x="50" y="132" text-anchor="middle" class="small">Casey</text>
    </g>
  </g>

  <!-- Right card: yearbook template -->
  <g transform="translate(470 70)">
    <rect class="card" rx="16" ry="16" width="520" height="480"/>
    <text x="26" y="38" class="label">Yearbook template</text>
    <text x="26" y="64" class="small">Custom layout with photo + name + quote</text>

    <!-- Template grid (2 columns x 3 rows) -->
    <g transform="translate(26 90)">
      <!-- Row 1 Left -->
      <g transform="translate(0 0)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
      <!-- Row 1 Right -->
      <g transform="translate(240 0)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
      <!-- Row 2 Left -->
      <g transform="translate(0 180)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
      <!-- Row 2 Right -->
      <g transform="translate(240 180)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
      <!-- Row 3 Left -->
      <g transform="translate(0 360)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
      <!-- Row 3 Right -->
      <g transform="translate(240 360)">
        <rect class="slot" width="200" height="130" rx="14" ry="14"/>
        <line class="name-line" x1="10" y1="146" x2="120" y2="146"/>
        <line class="quote-line" x1="10" y1="162" x2="180" y2="162"/>
      </g>
    </g>
  </g>

  <!-- Motion arrows aligned to slots -->
  <g>
    <!-- Arrow to row1-left -->
    <path class="arrow arrow-anim" d="M390 190 C 470 180, 520 170, 560 170" fill="none"/>
    <polygon class="arrow-head" points="560,170 546,164 546,176"/>

    <!-- Arrow to row1-right -->
    <path class="arrow arrow-anim" d="M430 230 C 520 230, 600 220, 720 220" fill="none"/>
    <polygon class="arrow-head" points="720,220 706,214 706,226"/>

    <!-- Arrow to row2-left -->
    <path class="arrow arrow-anim" d="M390 320 C 470 320, 520 310, 560 310" fill="none"/>
    <polygon class="arrow-head" points="560,310 546,304 546,316"/>

    <!-- Arrow to row2-right -->
    <path class="arrow arrow-anim" d="M430 360 C 520 360, 600 350, 720 350" fill="none"/>
    <polygon class="arrow-head" points="720,350 706,344 706,356"/>

    <!-- Arrow to row3-left -->
    <path class="arrow arrow-anim" d="M390 450 C 470 440, 520 430, 560 430" fill="none"/>
    <polygon class="arrow-head" points="560,430 546,424 546,436"/>
  </g>

  <!-- Traveling dots -->
  <g>
    <circle r="10" fill="var(--accent)" opacity="0.9">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M390 190 C 470 180, 520 170, 560 170"/>
    </circle>
    <circle r="10" fill="var(--accent-2)" opacity="0.9">
      <animateMotion dur="2.8s" begin="0.3s" repeatCount="indefinite" path="M430 230 C 520 230, 600 220, 720 220"/>
    </circle>
    <circle r="10" fill="#f97316" opacity="0.9">
      <animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M390 320 C 470 320, 520 310, 560 310"/>
    </circle>
    <circle r="10" fill="#8b5cf6" opacity="0.9">
      <animateMotion dur="3.1s" begin="0.9s" repeatCount="indefinite" path="M430 360 C 520 360, 600 350, 720 350"/>
    </circle>
    <circle r="10" fill="#14b8a6" opacity="0.9">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M390 450 C 470 440, 520 430, 560 430"/>
    </circle>
  </g>

  <!-- Pills for statuses -->
  <g transform="translate(70 570)">
    <rect class="pill" x="0" y="-14" rx="10" ry="10" width="120" height="28"/>
    <text class="pill-text" x="14" y="6">Auto-match on</text>
    <rect class="pill" x="140" y="-14" rx="10" ry="10" width="150" height="28"/>
    <text class="pill-text" x="154" y="6">Face centering enabled</text>
  </g>
</svg>
